name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  JANUSX_REQUIRE_OPENBLAS: "1"

jobs:
  validate:
    name: Build, tests, and Python smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev pkg-config

      - name: Install NumPy for PyO3-backed Rust tests
        run: python -m pip install numpy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all Rust targets
        run: cargo check --locked --all-targets

      - name: Run Rust library tests
        run: cargo test --locked --lib

      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/janusx-pycache
        run: python -m compileall -q python/janusx

      - name: Build and install the Python package
        run: python -m pip install .

      - name: Smoke test the native extension and CLI
        run: |
          python -c 'import janusx.janusx as native; print(native.__file__)'
          jx --version
          jx --help >/dev/null
