name: Build Wheels

run-name: build-wheels/${{ inputs.target || 'all' }} @ ${{ inputs.source_ref || 'main' }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Repository containing JanusX"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Source to build"
        required: true
        default: "main"
        type: choice
        # GitHub choice inputs are static. Add future release tags here.
        options:
          - main
          - v2.0.2
          - v2.0.1-imp-release-20261117
          - v2.0.1
          - v2.0.0
          - v1.0.27
          - v1.0.26
          - v1.0.25
          - v1.0.24
          - v1.0.23
          - v1.0.22
          - v1.0.21
          - v1.0.20
          - v1.0.19
          - v1.0.18
          - v1.0.17
          - v1.0.16
          - v1.0.15
          - v1.0.14
          - v1.0.13
          - v1.0.12
          - v1.0.11
          - v1.0.10
          - v1.0.9
          - v1.0.8
          - v1.0.7
          - v1.0.6
          - v1.0.5
          - v1.0.4
          - v1.0.3
          - v1.0.2
          - v1.0.1
          - v1.0.0
          - v0.1.0
      target:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
          - windows-x86_64
          - windows-arm64
      include_sdist:
        description: "Also build the source distribution"
        required: true
        default: false
        type: boolean
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "14"
        type: string
  workflow_call:
    inputs:
      source_repository:
        description: "Repository containing the JanusX source tree"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Git ref (tag/sha/branch) to build from"
        required: false
        default: "main"
        type: string
      package_version:
        description: "Resolved package version to sync before wheel build"
        required: false
        default: ""
        type: string
      target:
        description: "Single target label to build, or all"
        required: false
        default: "all"
        type: string
      include_sdist:
        description: "Also build the source distribution"
        required: false
        default: false
        type: boolean
      retention_days:
        description: "Artifact retention days"
        required: false
        default: "14"
        type: string
    secrets:
      checkout_token:
        required: false

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.workflow }}-${{ inputs.source_ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-matrix:
    name: Prepare wheel matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select target matrix
        id: select
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import json
          import os

          target = (os.environ.get("TARGET") or "all").strip() or "all"

          standard = [
              {
                  "label": "linux-x86_64",
                  "runner": "ubuntu-latest",
                  "platform": "linux",
                  "python-version": "3.10",
                  "manylinux": "2014",
                  "manylinux_image": "quay.io/pypa/manylinux2014_x86_64:latest",
                  "interpreter": "/opt/python/cp310-cp310/bin/python",
                  "target": "x86_64-unknown-linux-gnu",
                  "require_openblas": "1",
                  "prefer_accelerate": "0",
                  "expected_backend": "openblas",
                  "upload_wheel": "true",
                  "run_smoke_test": "true",
              },
              {
                  "label": "linux-aarch64",
                  "runner": "ubuntu-24.04-arm",
                  "platform": "linux",
                  "python-version": "3.10",
                  "manylinux": "2014",
                  "manylinux_image": "quay.io/pypa/manylinux2014_aarch64:latest",
                  "interpreter": "/opt/python/cp310-cp310/bin/python",
                  "target": "aarch64-unknown-linux-gnu",
                  "require_openblas": "1",
                  "prefer_accelerate": "0",
                  "expected_backend": "openblas",
                  "upload_wheel": "true",
                  "run_smoke_test": "false",
              },
              {
                  "label": "macos-arm64",
                  "runner": "macos-15",
                  "platform": "macos",
                  "python-version": "3.10",
                  "target": "aarch64-apple-darwin",
                  "blas_backend": "accelerate",
                  "require_openblas": "0",
                  "prefer_accelerate": "1",
                  "expected_backend": "accelerate",
                  "upload_wheel": "true",
                  "run_smoke_test": "true",
              },
              {
                  "label": "windows-x86_64",
                  "runner": "windows-2025-vs2026",
                  "platform": "windows",
                  "python-version": "3.10",
                  "target": "x86_64-pc-windows-msvc",
                  "require_openblas": "1",
                  "prefer_accelerate": "0",
                  "expected_backend": "openblas",
                  "upload_wheel": "true",
                  "run_smoke_test": "true",
              },
              {
                  "label": "windows-arm64",
                  "runner": "windows-2025-vs2026",
                  "platform": "windows",
                  "python-version": "3.10",
                  "target": "aarch64-pc-windows-msvc",
                  "require_openblas": "1",
                  "prefer_accelerate": "0",
                  "expected_backend": "openblas",
                  "upload_wheel": "true",
                  "run_smoke_test": "false",
              },
          ]

          expected_labels = {
              "linux-x86_64",
              "linux-aarch64",
              "macos-arm64",
              "windows-x86_64",
              "windows-arm64",
          }
          labels = {entry["label"] for entry in standard}
          if labels != expected_labels:
              raise SystemExit(f"Wheel matrix labels changed: {sorted(labels)}")

          python_versions = {entry["python-version"] for entry in standard}
          if python_versions != {"3.10"}:
              raise SystemExit(
                  "Wheel builds must use one CPython 3.10 abi3 build per platform, "
                  f"got Python versions {sorted(python_versions)}"
              )

          entries = standard
          if target != "all":
              entries = [entry for entry in entries if entry["label"] == target]
              if not entries:
                  raise SystemExit(f"Unsupported target {target!r}")

          matrix = {"include": entries}
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("matrix<<EOF\n")
              fh.write(json.dumps(matrix))
              fh.write("\nEOF\n")
          print(
              f"[wheel-matrix] target={target} "
              f"entries={len(entries)} abi=abi3-py310"
          )
          PY

  build-wheels:
    name: Build wheels (${{ matrix.label }})
    needs:
      - prepare-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      JANUSX_REQUIRE_OPENBLAS: ${{ matrix.require_openblas }}
      JANUSX_MACOS_PREFER_ACCELERATE: ${{ matrix.prefer_accelerate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository != '' && inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.checkout_token != '' && secrets.checkout_token || github.token }}

      - name: Checkout workflow CI helpers
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-helpers
          sparse-checkout: |
            scripts/ci
            scripts/sync_version_from_tag.py
          sparse-checkout-cone-mode: false

      - name: Sync version for package build
        shell: bash
        run: |
          VERSION="${{ inputs.package_version }}"
          SOURCE_REF="${{ inputs.source_ref }}"
          if [[ -z "$VERSION" ]]; then
            REF_NAME="${SOURCE_REF#refs/tags/}"
            if [[ "$REF_NAME" == v* ]]; then
              VERSION="${REF_NAME#v}"
            fi
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Skip sync_version_from_tag.py (no package version override)"
            exit 0
          fi
          echo "Using package version: $VERSION"
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          $PY .ci-helpers/scripts/sync_version_from_tag.py "$VERSION" "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo build cache
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ matrix.label }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'src/**/*', 'scripts/build_backend.py') }}
          restore-keys: |
            cargo-target-${{ matrix.label }}-

      - name: Install build tools
        if: ${{ matrix.platform != 'linux' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.9.4 build "numpy>=1.23" "pybind11>=2.13" zstandard

      - name: Restore macOS OpenBLAS build cache
        if: ${{ matrix.platform == 'macos' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/janusx-openblas-macos-cache
          key: openblas-${{ matrix.label }}-0.3.33-pthreads-${{ hashFiles('.ci-helpers/scripts/ci/build_macos_openblas.sh') }}

      - name: Install OpenBLAS (macOS, pthreads)
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          command -v gfortran >/dev/null 2>&1 || brew install gcc
          command -v pkg-config >/dev/null 2>&1 || brew install pkgconf
          OPENBLAS_CACHE_PREFIX="${RUNNER_TEMP}/janusx-openblas-macos-cache/prefix"
          if [[ -s "${OPENBLAS_CACHE_PREFIX}/lib/libopenblas.dylib" ]]; then
            echo "[wheel-macos] reusing cached pthreads OpenBLAS from ${OPENBLAS_CACHE_PREFIX}"
          else
            OPENBLAS_BUILD_ROOT="${RUNNER_TEMP}/janusx-openblas-macos-cache/build" \
            OPENBLAS_PREFIX="${OPENBLAS_CACHE_PREFIX}" \
              bash .ci-helpers/scripts/ci/build_macos_openblas.sh
            rm -rf "${RUNNER_TEMP}/janusx-openblas-macos-cache/build"
          fi
          {
            echo "OPENBLAS_LIB_DIR=${OPENBLAS_CACHE_PREFIX}/lib"
            echo "OPENBLAS_INCLUDE_DIR=${OPENBLAS_CACHE_PREFIX}/include"
            echo "PKG_CONFIG_PATH=${OPENBLAS_CACHE_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Install OpenBLAS (Windows x86_64, conda-forge threaded)
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "condaforge-openblas-win64"
          python .ci-helpers/scripts/ci/install_windows_condaforge_openblas.py `
            --subdir win-64 `
            --flavor pthreads `
            --dest "$dest" `
            --github-env "$env:GITHUB_ENV" `
            --verbose

      - name: Restore vcpkg binary cache
        if: ${{ matrix.label == 'windows-arm64' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-openblas-arm64-windows-static-md-v1

      - name: Install OpenBLAS (Windows ARM64 via vcpkg)
        if: ${{ matrix.label == 'windows-arm64' }}
        shell: pwsh
        run: |
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path $vcpkgRoot)) {
            $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
            git clone --depth=1 https://github.com/microsoft/vcpkg $vcpkgRoot
          }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }

          # Keep static-md for ARM64 cross-build; Rust side will detect static
          # layout and switch OpenBLAS extern linkage to kind=static.
          $triplet = "arm64-windows-static-md"

          & "$vcpkgRoot\vcpkg.exe" install "openblas[threads]:$triplet"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install openblas[threads] failed for triplet $triplet"
          }
          & "$vcpkgRoot\vcpkg.exe" install "zlib:$triplet"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install zlib failed for triplet $triplet"
          }

          $installed = Join-Path $vcpkgRoot "installed\$triplet"
          $binDir = Join-Path $installed "bin"
          # zlib 1.4 names the Windows static library libzs.lib.  Older
          # ports used zlibstatic.lib/zlib.lib, so keep those names as
          # fallbacks instead of assuming the filename starts with z.
          $zlibNames = @("libzs.lib", "zlibstatic.lib", "zlib.lib", "libz.lib", "zlib1.lib", "z.lib")
          $zlibLib = $zlibNames |
            ForEach-Object {
              Get-Item -LiteralPath (Join-Path "$installed\lib" $_) -ErrorAction SilentlyContinue
            } |
            Select-Object -First 1
          if (-not $zlibLib) {
            $availableLibs = (Get-ChildItem -Path "$installed\lib" -Filter "*.lib" -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name) -join ", "
            throw "No zlib library found under $installed\\lib. Available .lib files: $availableLibs"
          }
          if (Test-Path $binDir) {
            "OPENBLAS_BIN_DIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "OPENBLAS_LIB_DIR=$installed\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENBLAS_INCLUDE_DIR=$installed\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_LIB_DIR=$installed\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JANUSX_ZLIB_LIB_DIR=$installed\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JANUSX_ZLIB_LIB=$($zlibLib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Linux OpenBLAS cache
        if: ${{ matrix.platform == 'linux' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/janusx-openblas-cache
          key: openblas-${{ matrix.label }}-0.3.33-shared-${{ hashFiles('.ci-helpers/scripts/ci/build_linux_openblas.sh') }}

      - name: Prepare Linux OpenBLAS cache directory
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/janusx-openblas-cache/prefix"

      - name: Build wheels (Linux)
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.manylinux_image }}"
          INTERP="${{ matrix.interpreter }}"

          docker run --rm \
            -v "$PWD:/io" \
            -v "${RUNNER_TEMP}/janusx-openblas-cache:/openblas-cache" \
            -w /io \
            "$IMAGE" \
            bash -lc "
              set -euo pipefail
              yum install -y epel-release || true
              yum install -y gcc gcc-gfortran make pkgconfig curl tar gzip
              rm -rf dist dist_raw
              mkdir -p dist dist_raw
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
              source /root/.cargo/env
              export PATH=\"$(dirname ${INTERP}):\${PATH}\"
              ${INTERP} -m pip install -U pip
              ${INTERP} -m pip install maturin==1.9.4 build 'numpy>=1.23' 'pybind11>=2.13' auditwheel
              export OPENBLAS_VERSION=0.3.33
              if [[ -s /openblas-cache/prefix/lib/libopenblas.so ]]; then
                echo '[janusx] using cached Linux OpenBLAS'
                export OPENBLAS_LIB_DIR=/openblas-cache/prefix/lib
                export OPENBLAS_INCLUDE_DIR=/openblas-cache/prefix/include
              else
                export OPENBLAS_BUILD_ROOT=/openblas-cache/build
                export OPENBLAS_PREFIX=/openblas-cache/prefix
                . /io/.ci-helpers/scripts/ci/build_linux_openblas.sh
              fi
              rm -rf /openblas-cache/build
              export JANUSX_REQUIRE_OPENBLAS=1
              export JANUSX_STRICT_KMC_BIND=1
              ${INTERP} -m build --wheel --outdir dist_raw --no-isolation
              ${INTERP} /io/.ci-helpers/scripts/ci/check_wheel_kmc.py --exactly-one dist_raw/*.whl
              auditwheel show dist_raw/*.whl
              auditwheel repair dist_raw/*.whl -w dist
              ${INTERP} /io/.ci-helpers/scripts/ci/check_wheel_kmc.py --exactly-one dist/*.whl
              ${INTERP} -m pip install --force-reinstall --no-deps dist/*.whl
              CXX=/bin/false ${INTERP} /io/.ci-helpers/scripts/ci/check_installed_runtime.py \
                --require-openblas \
                --require-pthreads-openblas \
                --check-kmc-load
            "

      - name: Build wheels (macOS/Windows)
        if: ${{ matrix.platform != 'linux' }}
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            export JANUSX_STRICT_KMC_BIND=1
            export JANUSX_BUNDLE_OPENBLAS_DYLIB=1
            export JANUSX_STRICT_OPENBLAS_BUNDLE=1
            python -m build --wheel --outdir dist --no-isolation
          elif [[ "${{ matrix.label }}" == "windows-x86_64" ]]; then
            export JANUSX_STRICT_KMC_BIND=1
            python -m build --wheel --outdir dist --no-isolation
          elif [[ "${{ matrix.label }}" == "windows-arm64" ]]; then
            # Cross-building Windows ARM64 from x64 host: avoid binding to host-arch Python import libs.
            export PYO3_CROSS=1
            export PYO3_CROSS_PYTHON_VERSION=3.10
            # Skip KMC prebuild on cross target; vendored pybind11 in KMC is not
            # Python 3.14 friendly and this path is not required for arm64 wheel sanity.
            export JANUSX_PREBUILD_KMC_BIND=0
            maturin build --release --out dist --target ${{ matrix.target }} --features blas-openblas,python-extension
          else
            maturin build --release --out dist --target ${{ matrix.target }} --interpreter python --features blas-openblas,python-extension
          fi

      - name: Check macOS wheel Mach-O LINKEDIT alignment
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          python .ci-helpers/scripts/ci/check_macos_linkedit.py dist/*.whl

      - name: Clear build-only Windows OpenBLAS hints
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: |
          # The wheel now contains its runtime DLLs; later probes must exercise
          # the packaged runtime instead of the temporary build directory.
          printf 'OPENBLAS_BIN_DIR=\nOPENBLAS_LIB_DIR=\nLIBRARY_BIN=\nLIBRARY_LIB=\n' >> "$GITHUB_ENV"

      - name: Probe SGEMM backend from built wheel
        if: ${{ matrix.label != 'windows-arm64' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --force-reinstall --no-deps dist/*.whl
          "$PY" - <<'PY'
          import janusx.janusx as _jx
          backend = _jx.rust_sgemm_backend()
          expected = "${{ matrix.expected_backend }}"
          print(f"[janusx] rust_sgemm_backend={backend}")
          if backend != expected:
              raise SystemExit(f"Strict mode failed: expected {expected!r} backend, got {backend!r}")
          PY

      - name: Verify bundled macOS dylib signature + load probe
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" .ci-helpers/scripts/ci/check_installed_runtime.py --check-macos-bundled-openblas

      - name: Verify Rust eigh LAPACK backend (windows-x86_64)
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" - <<'PY'
          import numpy as np
          import janusx.janusx as _jx
          rng = np.random.default_rng(20260501)
          raw = rng.random((128, 128), dtype=np.float64) - 0.5
          a = np.ascontiguousarray(0.5 * (raw + raw.T), dtype=np.float64)
          _ = _jx.rust_eigh_from_array_f64(a, threads=4, driver="auto", jobz="V", require_lapack=True)
          print("[janusx] rust_eigh_from_array_f64(require_lapack=True) passed")
          PY

      - name: Verify bundled OpenBLAS is pthreads (windows-x86_64)
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" .ci-helpers/scripts/ci/check_installed_runtime.py --require-openblas --require-pthreads-openblas

      - name: Verify OpenBLAS threading (windows-x86_64)
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" - <<'PY'
          import os
          import numpy as np
          import janusx.janusx as _jx

          target = 8
          for k in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "MKL_NUM_THREADS"):
              os.environ[k] = str(target)

          ok = bool(_jx.rust_blas_set_num_threads(target))
          got = int(_jx.rust_blas_get_num_threads())
          print(f"[janusx] rust_blas_set_num_threads({target}) -> {ok}")
          print(f"[janusx] rust_blas_get_num_threads() -> {got}")
          if not ok:
              raise SystemExit("Strict mode failed: rust_blas_set_num_threads returned False")
          if got < 2:
              raise SystemExit(
                  "Strict mode failed: OpenBLAS thread control ineffective "
                  f"(expected >=2, got {got})."
              )
          rng = np.random.default_rng(20260501)
          raw = rng.random((256, 256), dtype=np.float64) - 0.5
          a = np.ascontiguousarray(0.5 * (raw + raw.T), dtype=np.float64)
          _ = _jx.rust_eigh_from_array_f64(
              a,
              threads=target,
              driver="auto",
              jobz="V",
              require_lapack=True,
          )
          print("[janusx] OpenBLAS threading self-check passed")
          PY

      - name: Verify KMC prebuilt in wheel (all except windows-arm64)
        if: ${{ matrix.label != 'windows-arm64' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --force-reinstall --no-deps dist/*.whl
          "$PY" .ci-helpers/scripts/ci/check_wheel_kmc.py --exactly-one
          "$PY" .ci-helpers/scripts/ci/check_installed_runtime.py --check-kmc-load

      - name: Wheel runtime smoke test
        if: ${{ matrix.run_smoke_test == 'true' }}
        shell: bash
        run: |
          # The build steps export OpenBLAS hints for compilation. Clear them
          # before installing the wheel so the smoke test exercises the
          # bundled runtime rather than a stale build-time DLL path.
          unset OPENBLAS_BIN_DIR OPENBLAS_LIB_DIR OPENBLAS_INCLUDE_DIR LIBRARY_BIN LIBRARY_LIB
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --force-reinstall dist/*.whl
          "$PY" scripts/ggval.py \
            --mode smoke \
            --threads 2 \
            --cv 2 \
            --no-backend-thread-checks

      - name: Verify macOS wheel links Accelerate only
        if: ${{ matrix.platform == 'macos' && matrix.blas_backend == 'accelerate' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          EXT_PATH="$("$PY" - <<'PY'
          import janusx.janusx as _jx
          print(_jx.__file__)
          PY
          )"
          echo "[janusx] extension path: ${EXT_PATH}"
          otool -L "${EXT_PATH}"
          if ! otool -L "${EXT_PATH}" | grep -q "Accelerate.framework"; then
            echo "ERROR: Expected Accelerate linkage in macOS wheel."
            exit 1
          fi
          if otool -L "${EXT_PATH}" | grep -qi "libopenblas"; then
            echo "ERROR: OpenBLAS linkage detected in macOS Accelerate variant."
            exit 1
          fi

      - name: Accelerate GRM smoke test (macOS)
        if: ${{ matrix.platform == 'macos' && matrix.blas_backend == 'accelerate' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --force-reinstall dist/*.whl
          mkdir -p test
          TEST_PREFIX="test/mouse_hs1940"
          jx gformat -vcf example/mouse_hs1940.vcf.gz -fmt bfile -o "$TEST_PREFIX"
          jx grm -bfile "$TEST_PREFIX" -o test
          "$PY" - <<'PY'
          import os
          import numpy as np
          import janusx.janusx as _jx
          bundled = os.environ.get("JX_OPENBLAS_LIB_PATH", "")
          print(f"[janusx] JX_OPENBLAS_LIB_PATH={bundled}")
          rng = np.random.default_rng(20260501)
          raw = rng.random((128, 128), dtype=np.float64) - 0.5
          a = np.ascontiguousarray(0.5 * (raw + raw.T), dtype=np.float64)
          _, _, backend, evd_backend, *_ = _jx.rust_eigh_from_array_f64(
              a,
              threads=2,
              driver="auto",
              jobz="V",
              require_lapack=True,
          )
          print(f"[janusx] rust_sgemm_backend={backend}")
          print(f"[janusx] rust_eigh_backend={evd_backend}")
          if backend != "accelerate":
              raise SystemExit(f"Strict mode failed: expected accelerate BLAS backend, got {backend!r}")
          if "openblas_dyn" not in evd_backend:
              raise SystemExit(
                  "Strict mode failed: expected macOS dynamic OpenBLAS LAPACK path "
                  f"(openblas_dyn), got {evd_backend!r}"
              )
          PY

      - name: Sanity check wheel artifact (windows-arm64 cross-build)
        if: ${{ matrix.label == 'windows-arm64' }}
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" - <<'PY'
          import glob
          import os
          import zipfile

          wheels = glob.glob("dist/*.whl")
          print(f"[windows-arm64] built wheels: {wheels}")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, got {len(wheels)}")
          wheel = wheels[0]
          if "win_arm64" not in os.path.basename(wheel):
              raise SystemExit(f"Expected win_arm64 wheel, got {wheel}")
          with zipfile.ZipFile(wheel, "r") as zf:
              names = zf.namelist()
          if not any(name.endswith(".pyd") for name in names):
              raise SystemExit("No .pyd extension module found inside wheel")
          print("[windows-arm64] runtime probe skipped on x64 host; static wheel sanity check passed.")
          PY

      - name: Stage final wheel artifact
        if: ${{ matrix.upload_wheel == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse
          mkdir -p wheelhouse
          LABEL="${{ matrix.label }}"
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          if [[ "${LABEL}" != "windows-arm64" ]]; then
            "$PY" .ci-helpers/scripts/ci/check_wheel_kmc.py --exactly-one dist/*.whl
          else
            echo "[wheel-build] skip KMC prebuilt wheel check for ${LABEL} (cross-build path sets JANUSX_PREBUILD_KMC_BIND=0)"
          fi
          "$PY" - <<'PY'
          import glob
          import os
          import shutil

          wheels = sorted(glob.glob("dist/*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one final wheel in dist/, got {len(wheels)}")
          wheel = wheels[0]
          dst = os.path.join("wheelhouse", os.path.basename(wheel))
          shutil.copy2(wheel, dst)
          print(f"[wheel-build] staged final wheel: {dst}")
          PY

      - name: Upload final wheel artifact
        if: ${{ matrix.upload_wheel == 'true' && inputs.retention_days != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheel-platform-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: Upload final wheel artifact
        if: ${{ matrix.upload_wheel == 'true' && inputs.retention_days == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: wheel-platform-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

      - name: Write artifact summary
        if: ${{ matrix.upload_wheel == 'true' }}
        shell: bash
        env:
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          WHEEL_NAME="$(basename wheelhouse/*.whl)"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### ${{ matrix.label }}
          - Wheel: \`${WHEEL_NAME}\`
          - Platform artifact: \`wheel-platform-${{ matrix.label }}\`
          - Actions artifact: individual files are merged into \`wheels-all\`. GitHub Actions artifacts require a GitHub login.
          - Run page: [workflow run](${RUN_URL})
          - Retention: Actions artifacts remain valid until the artifact or run expires.
          EOF

  verify-windows-arm64:
    name: Verify Windows ARM64 wheel
    needs:
      - build-wheels
    if: ${{ inputs.target == 'all' || inputs.target == 'windows-arm64' }}
    runs-on: windows-11-arm
    steps:
      - name: Download Windows ARM64 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-platform-windows-arm64
          path: dist

      - name: Set up Python (ARM64)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Verify Windows ARM64 runtime (import, OpenBLAS threading, LAPACK eigh)
        shell: bash
        run: |
          set -euo pipefail
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "numpy>=1.23"
          "$PY" -m pip install --force-reinstall --no-deps dist/*.whl
          "$PY" - <<'PY'
          import os
          import platform
          import numpy as np
          import janusx.janusx as _jx

          arch = platform.machine().lower()
          print(f"[windows-arm64] platform.machine()={arch}")
          if "arm" not in arch and "aarch64" not in arch:
              raise SystemExit(f"Expected ARM64 Python runtime, got {arch!r}")

          backend = _jx.rust_sgemm_backend()
          print(f"[windows-arm64] rust_sgemm_backend={backend}")
          if backend != "openblas":
              raise SystemExit(
                  f"Strict mode failed: expected 'openblas' backend, got {backend!r}"
              )

          target = 4
          for k in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "MKL_NUM_THREADS"):
              os.environ[k] = str(target)
          ok = bool(_jx.rust_blas_set_num_threads(target))
          got = int(_jx.rust_blas_get_num_threads())
          print(f"[windows-arm64] rust_blas_set_num_threads({target}) -> {ok}")
          print(f"[windows-arm64] rust_blas_get_num_threads() -> {got}")
          if not ok:
              raise SystemExit("Strict mode failed: rust_blas_set_num_threads returned False")
          if got < 2:
              raise SystemExit(
                  "Strict mode failed: OpenBLAS thread control ineffective "
                  f"(expected >=2, got {got})."
              )

          rng = np.random.default_rng(20260501)
          raw = rng.random((128, 128), dtype=np.float64) - 0.5
          a = np.ascontiguousarray(0.5 * (raw + raw.T), dtype=np.float64)
          evals, evecs, sgemm_backend, evd_backend, *_ = _jx.rust_eigh_from_array_f64(
              a,
              threads=target,
              driver="auto",
              jobz="V",
              require_lapack=True,
          )
          residual = float(np.max(np.abs(a @ evecs - evecs * evals)))
          print(
              f"[windows-arm64] rust_eigh_from_array_f64: sgemm={sgemm_backend} "
              f"eigh={evd_backend} max_residual={residual:.3e}"
          )
          if not np.isfinite(residual) or residual > 1e-10:
              raise SystemExit(f"Unexpected eigh residual on Windows ARM64: {residual}")
          PY

  bundle-wheels:
    name: Bundle wheels
    needs:
      - build-wheels
      - verify-windows-arm64
    if: ${{ !failure() && !cancelled() && needs.build-wheels.result == 'success' && (needs.verify-windows-arm64.result == 'success' || needs.verify-windows-arm64.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove previous merged wheels artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(
            gh api --paginate \
              "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "wheels-all") | .id'
          )"
          while IFS= read -r artifact_id; do
            if [[ -z "$artifact_id" ]]; then
              continue
            fi
            gh api --method DELETE \
              "/repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
          done <<< "$artifact_ids"

      - name: Merge platform wheels into one artifact
        if: ${{ inputs.retention_days != '' }}
        uses: actions/upload-artifact/merge@v4
        with:
          name: wheels-all
          pattern: wheel-platform-*
          delete-merged: false
          retention-days: ${{ inputs.retention_days }}

      - name: Merge platform wheels into one artifact
        if: ${{ inputs.retention_days == '' }}
        uses: actions/upload-artifact/merge@v4
        with:
          name: wheels-all
          pattern: wheel-platform-*
          delete-merged: false

  build-sdist:
    name: Build source distribution
    if: ${{ inputs.include_sdist }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository != '' && inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.checkout_token != '' && secrets.checkout_token || github.token }}

      - name: Checkout workflow CI helpers
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-helpers
          sparse-checkout: |
            scripts/sync_version_from_tag.py
          sparse-checkout-cone-mode: false

      - name: Sync version for package build
        shell: bash
        run: |
          VERSION="${{ inputs.package_version }}"
          SOURCE_REF="${{ inputs.source_ref }}"
          if [[ -z "$VERSION" ]]; then
            REF_NAME="${SOURCE_REF#refs/tags/}"
            if [[ "$REF_NAME" == v* ]]; then
              VERSION="${REF_NAME#v}"
            fi
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Skip sync_version_from_tag.py (no package version override)"
            rm -rf .ci-helpers
            exit 0
          fi
          echo "Using package version: $VERSION"
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          $PY .ci-helpers/scripts/sync_version_from_tag.py "$VERSION" "$GITHUB_WORKSPACE"
          rm -rf .ci-helpers

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.9.4

      - name: Build sdist
        run: |
          maturin sdist --out dist

      - name: Upload sdist artifact
        if: ${{ inputs.retention_days != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload sdist artifact
        if: ${{ inputs.retention_days == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
