name: Build ADAMIXTURE companion wheels

run-name: adamixture-wheels/${{ github.event.inputs.target || 'all' }} @ ${{ github.event.inputs.source_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "ADAMIXTURE repository"
        required: true
        default: "FJingxian/ADAMIXTURE"
        type: string
      source_ref:
        description: "ADAMIXTURE branch, tag, or commit"
        required: true
        default: "main"
        type: string
      package_version:
        description: "janusx-adamixture version"
        required: true
        default: "1.9.6.post1"
        type: string
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos
          - windows-x86_64
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "14"
        type: string
      publish_index:
        description: "Publish companion package after building"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build companion package
    uses: ./.github/workflows/reusable-adamixture-build.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      package_version: ${{ inputs.package_version }}
      target: ${{ inputs.target }}
      retention_days: ${{ inputs.retention_days }}
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  publish:
    name: Publish companion package
    if: ${{ inputs.publish_index != 'none' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download companion wheels
        uses: actions/download-artifact@v8
        with:
          pattern: adamixture-wheels-*
          path: dist
          merge-multiple: true

      - name: Download companion source distribution
        uses: actions/download-artifact@v8
        with:
          name: adamixture-sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: python -m pip install --upgrade pip twine

      - name: Publish to TestPyPI
        if: ${{ inputs.publish_index == 'testpypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          test -n "${TWINE_PASSWORD:-}" || { echo "Missing TEST_PYPI_API_TOKEN secret."; exit 1; }
          python -m twine upload --repository-url https://test.pypi.org/legacy/ --skip-existing dist/*

      - name: Publish to PyPI
        if: ${{ inputs.publish_index == 'pypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "${TWINE_PASSWORD:-}" || { echo "Missing PYPI_API_TOKEN secret."; exit 1; }
          python -m twine upload --skip-existing dist/*
