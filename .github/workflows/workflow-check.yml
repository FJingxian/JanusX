name: Workflow Check

on:
  pull_request:
    paths:
      - ".github/workflows/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-workflows:
    name: Lint workflow files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f) }; puts "YAML OK"'

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color

      - name: Verify reusable wheel workflow wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -nF "uses: ./.github/workflows/reusable-wheel-build.yml" \
            .github/workflows/build-wheel.yml \
            .github/workflows/release.yml

          grep -nF "matrix_preset: standard" .github/workflows/build-wheel.yml
          grep -nF "matrix_preset: release" .github/workflows/release.yml
          grep -nF "workflow_call:" .github/workflows/build-wheel.yml
          grep -nF "source_repository:" .github/workflows/build-wheel.yml

          grep -nF "Build wheels (Linux)" .github/workflows/reusable-wheel-build.yml
          grep -nF "Install OpenBLAS (Windows ARM64 via vcpkg)" .github/workflows/reusable-wheel-build.yml
          grep -nF "auditwheel repair" .github/workflows/reusable-wheel-build.yml

          clear_step_line="$(grep -nF \
            "      - name: Clear build-only Windows OpenBLAS hints" \
            .github/workflows/reusable-wheel-build.yml | cut -d: -f1 || true)"
          probe_step_line="$(grep -nF \
            "      - name: Probe SGEMM backend from built wheel" \
            .github/workflows/reusable-wheel-build.yml | cut -d: -f1 || true)"
          if [[ -z "$clear_step_line" || -z "$probe_step_line" || "$clear_step_line" -ge "$probe_step_line" ]]; then
            echo "Windows wheel probes must clear build-only OpenBLAS hints before importing the wheel."
            exit 1
          fi
          clear_block="$(sed -n "${clear_step_line},${probe_step_line}p" .github/workflows/reusable-wheel-build.yml)"
          for hint in OPENBLAS_BIN_DIR OPENBLAS_LIB_DIR LIBRARY_BIN LIBRARY_LIB; do
            if ! grep -qF "${hint}=" <<< "$clear_block"; then
              echo "Windows wheel probe cleanup is missing ${hint}."
              exit 1
            fi
          done

          if grep -nF \
            -e "Build wheels (Linux)" \
            -e "Install OpenBLAS (Windows ARM64 via vcpkg)" \
            -e "auditwheel repair" \
            .github/workflows/build-wheel.yml \
            .github/workflows/release.yml; then
            echo "Entry workflows should call reusable-wheel-build.yml instead of inlining wheel build logic."
            exit 1
          fi

      - name: Verify reusable sdist workflow wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -nF "uses: ./.github/workflows/reusable-sdist-build.yml" .github/workflows/release.yml
          grep -nF "name: Reusable sdist Build" .github/workflows/reusable-sdist-build.yml
          grep -nF "maturin sdist --out dist" .github/workflows/reusable-sdist-build.yml

          if grep -nF \
            -e "maturin sdist --out dist" \
            -e "- name: Build sdist" \
            .github/workflows/release.yml; then
            echo "release.yml should call reusable-sdist-build.yml instead of inlining sdist build logic."
            exit 1
          fi
