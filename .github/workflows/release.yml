name: Release

run-name: release/${{ inputs.target_index || 'testpypi' }} @ ${{ inputs.source || 'main' }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to build (main for TestPyPI; v* tag for PyPI)"
        required: true
        default: "main"
        type: choice
        # GitHub choice inputs are static. Add future release tags here.
        options:
          - main
          - v2.0.2
          - v2.0.1-imp-release-20261117
          - v2.0.1
          - v2.0.0
          - v1.0.27
          - v1.0.26
          - v1.0.25
          - v1.0.24
          - v1.0.23
          - v1.0.22
          - v1.0.21
          - v1.0.20
          - v1.0.19
          - v1.0.18
          - v1.0.17
          - v1.0.16
          - v1.0.15
          - v1.0.14
          - v1.0.13
          - v1.0.12
          - v1.0.11
          - v1.0.10
          - v1.0.9
          - v1.0.8
          - v1.0.7
          - v1.0.6
          - v1.0.5
          - v1.0.4
          - v1.0.3
          - v1.0.2
          - v1.0.1
          - v1.0.0
          - v0.1.0
      target_index:
        description: "Package index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "14"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  resolve-package-version:
    name: Resolve package version
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.resolve.outputs.package_version }}
      base_version: ${{ steps.resolve.outputs.base_version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source }}

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          RAW_REF: ${{ inputs.source }}
          TARGET_INDEX: ${{ inputs.target_index }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          raw_ref = (os.environ.get("RAW_REF") or "").strip()
          target_index = (os.environ.get("TARGET_INDEX") or "").strip().lower()
          if target_index not in {"testpypi", "pypi"}:
              raise SystemExit(f"Unsupported package index: {target_index!r}")

          ref = raw_ref[len("refs/tags/"):] if raw_ref.startswith("refs/tags/") else raw_ref
          is_tag = ref.startswith("v")
          if target_index == "pypi" and not is_tag:
              raise SystemExit("PyPI publishing requires a v* tag ref")

          if is_tag:
              base_version = ref[1:]
          else:
              project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
              base_version = str(project["project"]["version"]).strip()

          if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.\-+]*", base_version):
              raise SystemExit(f"Unsupported package version: {base_version!r}")

          package_version = base_version
          if target_index == "testpypi":
              def version_exists(version: str) -> bool:
                  url = f"https://test.pypi.org/pypi/janusx/{version}/json"
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          return getattr(response, "status", 200) == 200
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return False
                      raise

              dev_number = 1
              while dev_number <= 9999:
                  candidate = f"{base_version}.dev{dev_number}"
                  if not version_exists(candidate):
                      package_version = candidate
                      break
                  dev_number += 1
              else:
                  raise SystemExit(
                      f"Exhausted TestPyPI dev suffixes for {base_version}"
                  )

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"base_version={base_version}\n")
              handle.write(f"package_version={package_version}\n")
          print(
              f"[version-resolve] index={target_index} ref={raw_ref} "
              f"base={base_version} package={package_version}"
          )
          PY

  build-packages:
    name: Build release artifacts
    needs:
      - resolve-package-version
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/build-wheel.yml
    with:
      source_ref: ${{ inputs.source }}
      package_version: ${{ needs.resolve-package-version.outputs.package_version }}
      target: all
      include_sdist: true
      publish_github_release: false
      retention_days: ${{ inputs.retention_days }}
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  publish:
    name: Publish ${{ inputs.target_index }}
    needs:
      - build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install upload tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.9.4

      - name: Publish package
        env:
          TARGET_INDEX: ${{ inputs.target_index }}
          MATURIN_PYPI_TOKEN: ${{ inputs.target_index == 'pypi' && secrets.PYPI_API_TOKEN || secrets.TEST_PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MATURIN_PYPI_TOKEN:-}" ]]; then
            echo "Missing token for ${TARGET_INDEX}."
            exit 1
          fi
          args=(
            --non-interactive
            --skip-existing
          )
          if [[ "${TARGET_INDEX}" == "testpypi" ]]; then
            args+=(--repository-url https://test.pypi.org/legacy/)
          fi
          maturin upload "${args[@]}" wheelhouse/*.whl dist/*.tar.gz
